[project]
name = "object-select-gimp-plugin"
version = "0.1.0"
description = "Local image segmentation and edge refinement comparison viewer"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "python-multipart>=0.0.20",
    "pillow>=11,<13",
    "numpy>=2,<3",
    "scipy>=1.15,<2",
    "torch>=2.7,<3",
    "torchvision>=0.22,<1",
    "transformers>=5.3,<6",
    "huggingface-hub>=1,<2",
    "timm>=1,<2",
    "einops>=0.8,<1",
    "kornia>=0.8,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
