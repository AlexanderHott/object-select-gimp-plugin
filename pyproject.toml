[project]
name = "object-select-gimp-plugin"
version = "0.1.0"
description = "GIMP 3 object selection with local SAM, BiRefNet, and ViTMatte models"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pillow>=11,<13",
    "numpy>=2,<3",
    "scipy>=1.15,<2",
    "torch>=2.7,<3",
    "torchvision>=0.22,<1",
    "transformers>=5.3,<6",
    "huggingface-hub>=1,<2",
    "onnxruntime>=1.20,<2",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
