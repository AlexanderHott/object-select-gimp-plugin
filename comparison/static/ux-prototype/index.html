<!doctype html>
<!-- Throwaway: three GIMP selection flows, switchable with ?variant=A|B|C.
     Question: hover in the editor, region + refine, or a separate plugin preview?
     Fixed illustrated masks test interaction, not segmentation quality. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Object selection · UX prototypes</title>
  <link rel="stylesheet" href="style.css">
  <script src="scene.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="study-header">
    <div class="study-brand"><span class="study-mark">◩</span><div><strong>Object selection</strong><span>GIMP interaction studies</span></div></div>
    <div class="study-note">Interactive prototype <span>Fixed masks · no model · no GIMP connection</span></div>
    <button id="reset">Reset flow ↺</button>
  </header>
  <main>
    <section class="intro"><div><span id="eyebrow" class="eyebrow"></span><h1 id="heading"></h1><p id="description"></p></div><div class="experiment"><label>Simulated result<select id="scenario"><option value="clean">Clean selection</option><option value="extra">Includes camera strap</option><option value="missing">Misses camera lens</option></select></label><label>Response delay<select id="delay"><option value="0">Instant</option><option value="350">350 ms</option><option value="1200">1.2 seconds</option></select></label></div></section>
    <div class="task"><span class="task-label">TRY THIS</span><span id="task-text"></span><span id="task-progress"></span></div>
    <section id="editor" class="editor" aria-label="Simulated GIMP editor"></section>
    <div class="under-editor"><span id="integration"></span><details id="state-details"><summary>Inspect prototype state</summary><pre id="state"></pre></details></div>
  </main>
  <nav class="switcher" aria-label="Prototype variants"><button id="previous" aria-label="Previous variant">←</button><div class="variant-tabs"><button data-variant="A"><span>A</span> Hover & pick</button><button data-variant="B"><span>B</span> Draw & refine</button><button data-variant="C"><span>C</span> Plugin preview</button></div><button id="next" aria-label="Next variant">→</button></nav>
  <div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
</body>
</html>
